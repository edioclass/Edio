<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edio - Educational Audio Platform</title>
    <style>
        :root {
            --bg-main: #0F111A;
            --bg-card: #1E2235;
            --bg-track: #171A26;
            --primary: #5156CD;
            --text-main: #FFFFFF;
            --text-sub: #7E8494;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 120px;
        }

        header {
            padding: 20px;
            background-color: var(--bg-track);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #23283d;
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .search-bar {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background-color: var(--bg-card);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .search-bar::placeholder {
            color: #525866;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .course-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .track-card:active {
            transform: scale(0.98);
            background-color: var(--bg-track);
        }

        .track-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background-color: var(--bg-track);
        }

        .track-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .track-course {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
        }

        .track-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-meta {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* Bottom Player Deck */
        .player-deck {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-track);
            border-top: 1px solid #23283d;
            padding: 16px;
            z-index: 1000;
            display: none;
        }

        .player-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-media-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-img {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
        }

        .player-text {
            flex-grow: 1;
            overflow: hidden;
        }

        .player-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-sub {
            font-size: 12px;
            color: var(--text-sub);
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play {
            width: 50px;
            height: 50px;
            background-color: var(--primary);
            border-radius: 50%;
            font-size: 20px;
        }

        .scrubber-area {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .progress-slider {
            flex-grow: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #2a2f45;
            border-radius: 2px;
            outline: none;
        }

        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .time-box {
            font-size: 11px;
            color: var(--text-sub);
            min-width: 35px;
        }

        .loading-shimmer {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>EDIO CLOUD</h1>
            <input type="text" class="search-bar" id="searchField" placeholder="Search course, subject, or teacher...">
        </div>
    </header>

    <div style="text-align: center; margin: 15px auto;">
        <!-- YAHAN APNA COPY KIYA HUA ADSTERRA SCRIPT PASTE KAREIN -->
        <script async="async" data-cfasync="false" src="https://pl29556568.effectivecpmnetwork.com/3493586e1d5cd23919556f6bccfd3564/invoke.js"></script>
<div id="container-3493586e1d5cd23919556f6bccfd3564"></div>

    </div>

    <main>
        <div class="section-title" id="contentHeading">Available Educational Lectures</div>
        <div id="loading" class="loading-shimmer">Loading syllabus data...</div>
        <div class="course-container" id="playlistWrapper"></div>
    </main>

    <!-- Bottom Embedded Player Module -->
    <div class="player-deck" id="playerDeck">
        <div class="player-container">
            <div class="player-media-info">
                <img src="" id="pImg" class="player-img" alt="Thumbnail">
                <div class="player-text">
                    <div id="pTitle" class="player-title">Lecture Title</div>
                    <div id="pMeta" class="player-sub">Subject • Teacher</div>
                </div>
            </div>

            <div class="scrubber-area">
                <span class="time-box" id="timeCurrent">00:00</span>
                <input type="range" class="progress-slider" id="trackScrubber" value="0" min="0" max="100">
                <span class="time-box" id="timeTotal">00:00</span>
            </div>

            <div class="player-controls">
                <button class="btn" id="btnPrev">⏮</button>
                <button class="btn btn-play" id="btnPlay">▶</button>
                <button class="btn" id="btnNext">⏭</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://opensheet.elk.sh/1lKD4-800JJl8TJ_3mUnb7jBjbRwm_HoqdFCEK2u1rO0/playlist";
        let masterPlaylist = [];
        let currentTrackIndex = -1;
        const audioEngine = new Audio();

        // DOM Element Mapping
        const playlistWrapper = document.getElementById('playlistWrapper');
        const loadingView = document.getElementById('loading');
        const searchField = document.getElementById('searchField');
        const playerDeck = document.getElementById('playerDeck');
        const btnPlay = document.getElementById('btnPlay');
        const btnNext = document.getElementById('btnNext');
        const btnPrev = document.getElementById('btnPrev');
        const trackScrubber = document.getElementById('trackScrubber');
        const timeCurrent = document.getElementById('timeCurrent');
        const timeTotal = document.getElementById('timeTotal');

        // Fetch Data from Google Sheet
        async function fetchPlaylist() {
            try {
                const response = await fetch(API_URL);
                masterPlaylist = await response.json();
                loadingView.style.display = 'none';
                renderPlaylist(masterPlaylist);
            } catch (error) {
                loadingView.innerText = "Failed to load database. Check Internet connection.";
            }
        }

        function renderPlaylist(tracks) {
            playlistWrapper.innerHTML = "";
            if(tracks.length === 0) {
                playlistWrapper.innerHTML = `<div class="loading-shimmer">No lectures found.</div>`;
                return;
            }

            tracks.forEach((track) => {
                // Runtime search index configuration matching
                const realIndex = masterPlaylist.findIndex(t => t.id === track.id);
                
                const card = document.createElement('div');
                card.className = "track-card";
                card.onclick = () => initPlayback(realIndex);

                // Placeholder image protection handler
                const fallbackImg = track.image ? track.image : 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=150';

                card.innerHTML = `
                    <img src="${fallbackImg}" class="track-img" alt="course thumbnail">
                    <div class="track-info">
                        <span class="track-course">${track.course} • ${track.subject}</span>
                        <span class="track-title">${track.title}</span>
                        <span class="track-meta">Prof. ${track.teacher} | ⏱ ${track.duration}</span>
                    </div>
                `;
                playlistWrapper.appendChild(card);
            });
        }

        // Search Filter System Logic
        searchField.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = masterPlaylist.filter(t => 
                t.title.toLowerCase().includes(query) ||
                t.course.toLowerCase().includes(query) ||
                t.subject.toLowerCase().includes(query) ||
                t.teacher.toLowerCase().includes(query)
            );
            renderPlaylist(filtered);
        });

        // Audio Playback Pipeline
        function initPlayback(index) {
            if(index < 0 || index >= masterPlaylist.length) return;
            currentTrackIndex = index;
            const track = masterPlaylist[currentTrackIndex];

            // UI Update Player Deck Info
            document.getElementById('pImg').src = track.image ? track.image : 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=150';
            document.getElementById('pTitle').innerText = track.title;
            document.getElementById('pMeta').innerText = `${track.subject} • ${track.teacher}`;
            
            playerDeck.style.display = "block";

            // Engine Setup Direct Network Stream
            audioEngine.src = track.audio;
            audioEngine.play();
            btnPlay.innerText = "⏸";
        }

        // Media Event Control Listeners
        btnPlay.addEventListener('click', () => {
            if(audioEngine.paused) {
                audioEngine.play();
                btnPlay.innerText = "⏸";
            } else {
                audioEngine.pause();
                btnPlay.innerText = "▶";
            }
        });

        btnNext.addEventListener('click', () => {
            if(currentTrackIndex < masterPlaylist.length - 1) {
                initPlayback(currentTrackIndex + 1);
            } else {
                initPlayback(0); // Loop back to start
            }
        });

        btnPrev.addEventListener('click', () => {
            if(currentTrackIndex > 0) {
                initPlayback(currentTrackIndex - 1);
            }
        });

        // Time Tracker & Slider Sync
        audioEngine.addEventListener('timeupdate', () => {
            if(isNaN(audioEngine.duration)) return;
            const progress = (audioEngine.currentTime / audioEngine.duration) * 100;
            trackScrubber.value = progress;

            // Format Timing Dashboard Display
            timeCurrent.innerText = formatTime(audioEngine.currentTime);
            timeTotal.innerText = formatTime(audioEngine.duration);
        });

        trackScrubber.addEventListener('input', (e) => {
            if(!audioEngine.duration) return;
            const targetTime = (e.target.value / 100) * audioEngine.duration;
            audioEngine.currentTime = targetTime;
        });

        audioEngine.addEventListener('ended', () => {
            btnNext.click(); // Autoplay system cascade next trigger
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = Math.floor(secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Runtime Boot Lifecycle Initialization
        fetchPlaylist();
    </script>
</body>
</html>
